# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
git:
  diffRenderers:
    - command: delta --dark --paging=never --line-numbers
gui:
  showIcons: true
  nerdFontsVersion: "3"
  spinner:
    frames:
      - ""
      - ""
      - ""
      - ""
      - ""
      - ""
    rate: 100
