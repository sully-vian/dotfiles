set -g allow-passthrough on 
set -g mouse on                           # for scrolling & mouse support
set -g history-limit 100000                # increase history limit
set -g renumber-windows on
set -g automatic-rename-format "#{?pane_in_mode,tmux,#{pane_current_command}}#{?pane_dead,[dead],}"
set -s set-clipboard on
set -g popup-border-lines rounded
set -g extended-keys on
set -g extended-keys-format csi-u
bind -n S-Enter send-keys Escape "[13;2u" # bind terminal keys

set -g default-terminal "tmux-256color" # better colors
set-option -ga terminal-overrides ",st*:Tc"

set -as terminal-features ",st*:clipboard"

set -g prefix C-SPACE

set -g mode-style "bg=color19"

# copy mode
set -g mode-keys vi
bind C-v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X begin-selection \; send -X rectangle-on
bind -T copy-mode-vi y send -X copy-selection # vim-like yanking
bind -T copy-mode-vi Enter send -X copy-selection # do not exit copy mode
bind -T copy-mode-vi / command-prompt -i -p "search down" { send -X search-forward-incremental "%%%" }
bind p paste-buffer -p

bind x kill-pane # killing the last pane kills the window

# window navigation
bind J command-prompt "join-pane -s '%%'" # merge other window into current

# pane splitting
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# pane navigation
bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R

# vim-like pane naivation
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# session naviagtion
bind s choose-tree \;

# custom status bar
set -g status-style "bg=color00, fg=color18"
set -g status-interval 1
set -g status-left ""
set -g status-right-length 80
set -g status-right "#[fg=color02]#S #[fg=color03]#H | #[fg=color03] %a %d %b %Y #[fg=color02] %H:%M:%S"

set -g status-justify left
# window status bar
# Objective: space to separate windows, and have the current highlighted, with
# background half a character wider on left and right.
# For that: use a half block on right and left of current window and cleverly
# color with fg/bg
# for the separator, add a leading space to all windows except the one right
# after the current one since it already ends with the half block.

set -g window-status-style          "fg=color04, bg=color00"
set -g window-status-current-style  "fg=color00, bg=color04"
%hidden AFTER_ACTIVE="#{==:#{e|-:#{window_index},#{active_window_index}},1}"
# set -g window-status-format         "#{?$AFTER_ACTIVE,, }[#I]#W#{?window_end_flag, ,}"
# set -g window-status-current-format "▌[#I]#W▐"
set -g window-status-format "#{?$AFTER_ACTIVE,, }#I#{?window_end_flag, ,}"
set -g window-status-current-format "▌#I▐"
set -g window-status-separator ""

# pane border
set -g pane-border-style "fg=color07"
set -g pane-active-border-style "fg=color06"

# dim highlights when the terminal window loses focus
set -g focus-events on
set-hook -g client-focus-out {
    set -g window-status-current-style "fg=color00, bg=color08"
    set -g pane-active-border-style "fg=color08"
}
set-hook -g client-focus-in {
    set -g window-status-current-style "fg=color00, bg=color04"
    set -g pane-active-border-style "fg=color06"
}

bind g run git-origin
bind o run "$HOME/.scripts/tmux-hints.sh"
bind C-g popup -w 90% -h 90% -d "#{pane_current_path}" -T "#{pane_current_path}" -E "$SCRIPTS/tmux-popup-session.sh lazygit"
bind C-d popup -w 90% -h 90% -d "#{pane_current_path}" -T "#{pane_current_path}" -E "$SCRIPTS/tmux-popup-session.sh lazydocker"

# Vim-like gx
# tmux does not support multi-key bindings
# create a new intermediate 'copy-mode-vi-g' mode for bindings that start with 'g' in copy-mode-vi
bind -T copy-mode-vi g switch-client -T copy-mode-vi-g

# temporarily set the window's word-separators to not break url
bind-key -T copy-mode-vi-g x \
    set -w word-separators " !\"'()[]{}<>|·↲»" \; \
    send-keys -X select-word \; \
    send-keys -X copy-pipe "xargs -r xdg-open" \; \
    set -u -w word-separators

bind-key -T copy-mode-vi-g g send-keys -X history-top # 'gg' goes to history-top

# reload config
bind r source-file "$TMUX_CONF" \; display-message "Config reloaded"
